[workspace]
members = [".", "catalog", "daemon"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["VictoryTek"]
repository = "https://github.com/VictoryTek/VexPortal"

[workspace.dependencies]
vexportal-catalog = { path = "catalog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

[package]
name = "vexportal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A GUI for VexOS system management"

[dependencies]
vexportal-catalog.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
zbus.workspace = true
tokio.workspace = true
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
async-channel = "2"
futures-util = { version = "0.3", default-features = false }

[build-dependencies]
glib-build-tools = "0.20"

[profile.release]
opt-level = "s"
lto = true
strip = true
