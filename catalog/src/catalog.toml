  label = "Role"
  required = true
  widget = "choice"
  choices = ["desktop", "stateless", "htpc", "server", "headless-server", "vanilla"]

  [[recipe.params]]
  name = "variant"
  label = "GPU"
  required = true
  widget = "choice"
  choices = ["amd", "nvidia", "nvidia-legacy535", "intel", "vm"]

  [[recipe.params]]
  name = "flake"
  label = "Flake override"
  help = "Leave empty to use the flake this machine is configured with."
  widget = "text"
  format = "flake-ref"

[[recipe]]
name = "switch"
title = "Switch Role or GPU"
blurb = "Rebuild and activate a different VexOS role or GPU variant on this machine."
icon = "object-select-symbolic"
category = "build-deploy"
roles = ["desktop", "htpc", "server", "headless-server", "stateless", "vanilla"]
risk = "medium"
confirm = "This rebuilds the system and changes which role and GPU variant this machine boots. Test it first with Test Build if you are unsure."
refresh = ["variant", "generation"]
needs_upstream = true

  [[recipe.params]]
  name = "role"
  label = "Role"
  help = "Leave empty to keep the current role."
  widget = "choice"
  choices = ["desktop", "stateless", "htpc", "server", "headless-server", "vanilla"]

  [[recipe.params]]
  name = "variant"
  label = "GPU"
  help = "Legacy 535 covers Maxwell, Pascal and Volta cards."
  widget = "choice"
  choices = ["amd", "nvidia", "nvidia-legacy535", "intel", "vm"]

  [[recipe.params]]
  name = "flake"
  label = "Flake override"
  widget = "text"
  format = "flake-ref"

