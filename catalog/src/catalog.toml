# VexPortal recipe catalog
#
# Curated metadata for the vexos-nix justfile. `just` can enumerate its own recipes,
# but it keeps only the last comment line as a doc string, has no notion of roles, and
# cannot say whether a recipe is safe to run — so titles, blurbs, roles, risk levels
# and argument widgets live here.
#
# Keep this in sync with the justfile. `cargo test -p vexportal-catalog` compares the
# two against /etc/nixos/justfile and fails on drift.
#
#   roles  — which VexOS roles surface the recipe. Mirrors the `_require-*-role`
#            guards in the justfile; server recipes are `[private]` there and hidden
#            from `just --list`, which is exactly why this file has to carry them.
#   risk   — safe: reads state only, runs without a polkit prompt.
#            medium: reversible change, `auth_admin_keep`.
#            destructive: destroys data or cuts network access, `auth_admin`.
#   terminal      — interaction cannot be expressed as a form; GUI launches a terminal.
#   needs_upstream — still prompts in vexos-nix; needs the VEXOS_ASSUME_YES work
#                    before the form path is fully non-interactive.

# ─────────────────────────── Categories ───────────────────────────

