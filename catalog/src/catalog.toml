# Limine migration is two steps and a reboot in between: the first installs Limine
# alongside the existing systemd-boot entry, the second removes the fallback once the
# machine has demonstrably booted the new one.
[[action]]
id = "bootloader-switch"
command = ["bootloader", "switch"]
implements = "_bootloader-switch"
title = "Migrate to Limine"
blurb = "Install the Limine bootloader alongside the current systemd-boot entry and boot it first. UEFI only; nothing is removed."
icon = "drive-harddisk-system-symbolic"
page = "system"
group = "Bootloader"
roles = ["desktop", "htpc", "server", "headless-server", "stateless"]
risk = "medium"
confirm = "This patches the flake wrapper, rebuilds the system, and makes Limine the first UEFI boot entry. The systemd-boot entry stays as a fallback. Reboot and confirm Limine works before finishing the migration."

  [[action.params]]
  name = "target"
  label = "Bootloader"
  help = "Limine is the only supported migration target."
  default = "limine"
  widget = "choice"
  choices = ["limine"]

[[action]]
id = "bootloader-cleanup"
command = ["bootloader", "cleanup"]
implements = "_bootloader-cleanup"
title = "Finish Limine Migration"
blurb = "After Limine has booted successfully, remove the old systemd-boot entry and its leftover files."
icon = "edit-clear-all-symbolic"
page = "system"
group = "Bootloader"
roles = ["desktop", "htpc", "server", "headless-server", "stateless"]
risk = "destructive"
confirm = "This deletes the systemd-boot fallback entry and its files. It only runs if this session actually booted via Limine, and there is no way back to systemd-boot without reinstalling it."

[[action]]
id = "set-hostname"
command = ["set-hostname"]
implements = "set-hostname"
title = "Set Hostname"
blurb = "Change the system hostname. Applies immediately and persists across rebuilds."
icon = "computer-symbolic"
page = "system"
group = "Identity"
roles = ["desktop", "htpc", "server", "headless-server", "stateless", "vanilla"]
risk = "medium"

  # The justfile prompts when the name is empty, so the form never sends it empty.
  [[action.params]]
  name = "name"
  label = "Hostname"
  required = true
  widget = "text"
  format = "hostname"

[[action]]
id = "reboot"
command = ["reboot"]
implements = "reboot"
