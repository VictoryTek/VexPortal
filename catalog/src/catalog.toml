# VexPortal action catalog
#
# Curated metadata for the vexos-nix justfile. `just` can enumerate its own recipes,
# but it keeps only the last comment line as a doc string, has no notion of roles, and
# cannot say whether a recipe is safe to run — so titles, blurbs, roles, risk levels
# and argument widgets live here.
#
# Keep this in sync with the justfile. `cargo test -p vexportal-catalog` compares the
# two against tests/fixtures/vexos-nix-justfile.json (and /etc/nixos/justfile on a
# built host) and fails on drift.
#
#   command    — the argv after `just`; parameters are appended. Most operations sit
#                behind the justfile's grouped menus (`just feature enable gaming`),
#                which `exec just _feature-enable gaming` underneath.
#   implements — the justfile recipe that actually takes the parameters. The drift
#                check compares `params` against it.
#   roles      — which VexOS roles surface the action. Mirrors the `_require-*-role`
#                guards in the justfile.
#   risk       — safe: reads state only, runs without a polkit prompt.
#                medium: reversible change, `auth_admin_keep`.
#                destructive: destroys data or cuts network access, `auth_admin`.
#                Every destructive action must carry a `confirm` message.
#   mode       — daemon (default): run as root by vexportal-daemon, no terminal.
#                terminal: run as the logged-in user in VexPortal's built-in terminal,
#                because the recipe holds a conversation or acts on the user's own
#                account. `mode_reason` says which.
#   group      — the heading the action sits under on its page.
#   rebuild    — success edits a file the next rebuild reads, so the GUI offers one.
#
# Parameters of an action routed through a menu (`command` longer than one word) are
# re-split on whitespace by the justfile's `_menu` helper, so they must use a format
# that cannot contain whitespace. The catalog refuses to load otherwise.

# ─────────────────────────────── Pages ───────────────────────────────

