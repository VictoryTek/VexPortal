icon = "network-vpn-symbolic"
description = "The PIA VPN, its kill switch, and Tailscale."

[[page]]
id = "services"
title = "Services"
icon = "network-server-symbolic"
description = "Server service modules: what is enabled, how to reach it, and its health."

[[page]]
id = "storage"
