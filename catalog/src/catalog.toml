description = "Move between NixOS generations and check a release upgrade before taking it."

[[category]]
id = "features"
title = "Features"
icon = "preferences-other-symbolic"
description = "Optional feature modules for this host."

[[category]]
id = "services"
title = "Server Services"
icon = "network-server-symbolic"
description = "Enable, inspect and restart the service modules on this server."

[[category]]
id = "storage"
title = "Storage & Backup"
icon = "drive-harddisk-symbolic"
description = "Storage pools, remote mounts, and Plex backup and restore."

[[category]]
id = "network"
title = "Network & Remote"
icon = "network-wireless-symbolic"
description = "VPN kill switch, Tailscale, remote desktop and SSH keys."

[[category]]
