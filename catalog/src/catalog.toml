icon = "applications-utilities-symbolic"
description = "One-off setup tasks for this machine and your account."

# ─────────────────────────────── Features ───────────────────────────────
# One switch each on the Features page. `default_on` mirrors the module default the
# justfile's `_feature-list` assumes when features.nix does not mention the feature.

[[feature]]
name = "gaming"
title = "Gaming"
description = "Steam, Proton-GE, GameMode, Gamescope, Wine, controller support and gaming kernel tuning."

[[feature]]
name = "development"
title = "Development"
description = "Docker, VSCodium, Python, Node, Rust, Go and Nix language tooling."

[[feature]]
name = "print3d"
title = "3D Printing"
description = "Blender and OrcaSlicer."

[[feature]]
name = "virtualization"
title = "Virtualization"
description = "libvirtd, QEMU/KVM and GNOME Boxes."

[[feature]]
name = "sunshine"
title = "Game Streaming"
description = "Sunshine, a self-hosted Moonlight game-stream host."
default_on = true

[[feature]]
name = "vpn"
title = "PIA VPN"
description = "Private Internet Access over WireGuard or OpenVPN, with an nftables kill switch."

[[feature]]
name = "kernel"
title = "Custom Kernel"
description = "Boot a custom kernel from the VexOS kernel registry."

[[feature]]
name = "ai"
title = "AI Assistant"
description = "Claude Code or OpenCode, set up to change and troubleshoot VexOS. You apply its changes with a rebuild."

