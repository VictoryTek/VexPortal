# ─────────────────────────────── AI Assistant ───────────────────────────────
#
# The page is shown only while `ai` is on in features.nix. Everything here acts on the
# logged-in user's own files under ~/.config, ~/.local/share and ~/.cache, so every
# action runs as the user, never in the daemon (its HOME is /root). The assistant itself
# opens in the built-in terminal; the settings run silently. Both call the `vexos-ai`
# command by argv (github:VictoryTek/vexos-ai, docs/contract.md), not `just`.

[[action]]
id = "agent"
backend = "native"
command = ["agent"]
implements = "agent"
title = "Open AI Assistant"
blurb = "Start your AI assistant (Claude Code, Codex or OpenCode) in /etc/nixos to change or troubleshoot this machine."
icon = "user-available-symbolic"
page = "ai"
group = "Assistant"
roles = ["desktop", "htpc", "server"]
risk = "medium"
mode = "terminal"
mode_reason = "The assistant is a full-screen terminal program that runs as you."

[[action]]
id = "diagnose"
backend = "native"
command = ["diagnose"]
implements = "diagnose"
title = "Diagnose a Problem"
blurb = "Have the AI assistant explain failed units and this boot's errors, one service, or a failed rebuild. Read-only."
icon = "dialog-question-symbolic"
page = "ai"
group = "Assistant"
roles = ["desktop", "htpc", "server"]
risk = "safe"
mode = "terminal"
mode_reason = "The assistant answers in an interactive terminal session that runs as you."

  [[action.params]]
  name = "target"
  label = "What to look at"
  help = "Leave empty for failed units and this boot's errors; enter a unit name, or `rebuild` to reproduce a failed rebuild."
  widget = "text"
  format = "unit-target"

[[action]]
id = "ai-pick"
backend = "native"
command = ["ai-pick"]
implements = "ai-pick"
title = "Choose AI Assistant"
blurb = "Choose Claude Code, Codex or OpenCode as your assistant."
icon = "user-available-symbolic"
page = "ai"
group = "Assistant"
roles = ["desktop", "htpc", "server"]
risk = "medium"
mode = "user"

  [[action.params]]
  name = "agent"
  label = "Assistant"
  required = true
  widget = "choice"
  choices = ["claude", "codex", "opencode"]

[[action]]
id = "ai-crash-mute"
backend = "native"
command = ["ai-crash-mute"]
implements = "ai-crash-mute"
title = "Crash Notifications"
blurb = "Mute or unmute \"Diagnose with AI\" notifications for one program."
icon = "dialog-error-symbolic"
page = "ai"
group = "Crash Notifications"
