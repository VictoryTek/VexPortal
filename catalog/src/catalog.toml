title = "List Features"
blurb = "Show which optional feature modules are enabled on this host."
icon = "view-list-symbolic"
category = "features"
roles = ["desktop", "htpc", "server"]
risk = "safe"

[[recipe]]
name = "enable-feature"
title = "Enable Feature"
blurb = "Turn on an optional feature module. Takes effect on the next rebuild."
icon = "list-add-symbolic"
category = "features"
roles = ["desktop", "htpc", "server"]
risk = "medium"
refresh = ["features"]

  [[recipe.params]]
  name = "feature"
  label = "Feature"
  required = true
  widget = "choice-dynamic"
  source = "features"
  extra = ["all"]

[[recipe]]
name = "disable-feature"
title = "Disable Feature"
blurb = "Turn off an optional feature module. Takes effect on the next rebuild."
icon = "list-remove-symbolic"
category = "features"
roles = ["desktop", "htpc", "server"]
risk = "medium"
refresh = ["features"]

  [[recipe.params]]
  name = "feature"
  label = "Feature"
  required = true
  widget = "choice-dynamic"
  source = "features"
  extra = ["all"]

[[recipe]]
name = "fix-flake"
title = "Repair Feature Wiring"
blurb = "Patch /etc/nixos/flake.nix so it loads features.nix on every rebuild. Needed once on hosts whose wrapper predates feature toggles, and safe to re-run."
icon = "applications-engineering-symbolic"
category = "features"
roles = ["desktop", "htpc", "server"]
risk = "medium"
needs_upstream = true

