icon = "system-reboot-symbolic"
page = "system"
group = "Power"
roles = ["desktop", "htpc", "server", "headless-server", "stateless", "vanilla"]
risk = "medium"
confirm = "This machine restarts immediately. Unsaved work in other applications is lost."

[[action]]
id = "shutdown"
