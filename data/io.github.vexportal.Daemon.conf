<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name; nothing else can impersonate the daemon. -->
  <policy user="root">
    <allow own="io.github.vexportal.Daemon"/>
  </policy>

  <!-- Anyone may call in and receive signals. polkit, not D-Bus, decides what runs. -->
  <policy context="default">
    <allow send_destination="io.github.vexportal.Daemon"
           send_interface="io.github.vexportal.Daemon1"/>
    <allow send_destination="io.github.vexportal.Daemon"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.vexportal.Daemon"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
