# The server services VexOS can turn on: what they are, which systemd units they run,
# where to reach them, and what to know before using them.
#
# One table per service, in the order the Services page lists them. `notes` are
# "Label: text" lines shown on the service's page; `<server-ip>` stands for this host.
# `option` is the path under `vexos.server.` when it is not the service name, and
# `units` / `health` feed the status view (a unit that does not exist is skipped, so a
# docker- and a podman- unit can both be listed).
#
# Keep in sync with modules/server/*.nix in vexos-nix. VexPortal does not read the
# justfile for this any more, so a service added there needs a line here.

# ── Books & Reading ──────────────────────────────────────────────────────────

[[service]]
name = "chaptarr"
group = "Books & Reading"
description = "Audiobook & ebook collection manager (Readarr successor)"
units = ["docker-chaptarr"]
health = ["http://localhost:8789"]
notes = [
  "Web UI: http://<server-ip>:8789",
  "About: Audiobook and ebook collection manager (a re-work of Readarr). One container, SQLite under vexos.server.chaptarr.dataDir.",
  "Prowlarr: Add it as a Readarr-type application (the API is compatible).",
  "Note: Beta upstream. Put root folders and downloads under /data (vexos.server.chaptarr.libraryDir) so imports can hardlink.",
]

[[service]]
name = "grimmory"
group = "Books & Reading"
description = "Self-hosted ebook/comic/audiobook library"
units = ["docker-grimmory", "docker-grimmory-db"]
health = ["http://localhost:6060"]
notes = [
  "Web UI: http://<server-ip>:6060",
  "About: Digital library for ebooks, comics and audiobooks. Two containers: the app and its own MariaDB.",
  "Login: Create the admin account on first visit. There are no default credentials.",
  "Note: Drop files in vexos.server.grimmory.bookdropDir to import them into vexos.server.grimmory.libraryDir.",
]

[[service]]
name = "listenarr"
group = "Books & Reading"
description = "Audiobook collection manager (Sonarr/Radarr-style)"
units = ["docker-listenarr"]
health = ["http://localhost:4545"]
notes = [
  "Web UI: http://<server-ip>:4545",
  "About: Audiobook collection manager in the style of Sonarr and Radarr. One container.",
  "Note: Upstream publishes only rolling canary builds.",
]

